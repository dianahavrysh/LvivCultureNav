name: Pentagon CI

on:
  push:
    branches: [main, master, dev, test, pre-prod, prod]
  pull_request:

jobs:
  plan:
    name: Визначення середовища
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.pick.outputs.env }}
    steps:
      - id: pick
        env:
          NAME: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: echo "env=$NAME" >> "$GITHUB_OUTPUT"

  static:
    name: Lint + Typecheck
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  l1-l2:
    name: L1–L2 Unit + Local integration
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

  l3:
    name: L3 Global integration (DEV, TEST, PRE-PROD)
    needs: [plan, l1-l2]
    if: needs.plan.outputs.env != 'prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:l3

  l4:
    name: L4 Fault tolerance (TEST, PRE-PROD)
    needs: [plan, l3]
    if: contains(fromJSON('["test","pre-prod","main","master"]'), needs.plan.outputs.env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:fault-tolerance

  l5:
    name: L5 End-to-end (PRE-PROD)
    needs: [plan, l4]
    if: contains(fromJSON('["pre-prod","main","master"]'), needs.plan.outputs.env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run test:l5
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report